<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Design QA overview</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #dadbd6; font: 600 14px/1.3 Arial, sans-serif; color: #102a20; }
      main { width: 940px; margin: 24px auto; display: grid; grid-template-columns: 432px 424px; gap: 36px; }
      figure { margin: 0; }
      figcaption { margin-bottom: 10px; text-transform: uppercase; letter-spacing: .12em; }
      .frame { position: relative; width: 100%; height: 911px; overflow: hidden; background: #fff; box-shadow: 0 8px 24px rgba(0,0,0,.14); }
      .source { width: 864px; height: 1821px; transform: scale(.5); transform-origin: top left; }
      iframe { width: 1425px; height: 3061px; border: 0; transform: scale(.29755); transform-origin: top left; }
    </style>
  </head>
  <body>
    <main>
      <figure>
        <figcaption>Bronontwerp</figcaption>
        <div class="frame"><img class="source" src="/assets/qa-source.png" alt="Bronontwerp" /></div>
      </figure>
      <figure>
        <figcaption>Implementatie</figcaption>
        <div class="frame"><iframe src="/" title="Implementatie"></iframe></div>
      </figure>
    </main>
  </body>
</html>
