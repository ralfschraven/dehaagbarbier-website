<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Design QA hero focus</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #dadbd6; font: 600 13px/1.3 Arial, sans-serif; color: #102a20; }
      main { width: 1070px; margin: 22px auto; display: grid; grid-template-columns: 518px 513px; gap: 30px; }
      figure { margin: 0; }
      figcaption { margin-bottom: 9px; text-transform: uppercase; letter-spacing: .12em; }
      .frame { position: relative; width: 100%; height: 333px; overflow: hidden; background: #fff; box-shadow: 0 6px 18px rgba(0,0,0,.13); }
      .source { width: 864px; height: 1821px; transform: scale(.6); transform-origin: top left; }
      iframe { width: 1425px; height: 3061px; border: 0; transform: scale(.36); transform-origin: top left; }
    </style>
  </head>
  <body>
    <main>
      <figure><figcaption>Bronontwerp · hero</figcaption><div class="frame"><img class="source" src="/assets/qa-source.png" alt="Bronhero" /></div></figure>
      <figure><figcaption>Implementatie · hero</figcaption><div class="frame"><iframe src="/" title="Implementatie hero"></iframe></div></figure>
    </main>
  </body>
</html>
